.hero p { color: var(--muted); max-width: 52ch; margin: 12px 0 0; font-size: 1.05rem; }

.tile { text-align: left; display: flex; flex-direction: column; gap: 8px; border-radius: 16px; padding: 22px; min-height: 180px; border: 1px solid var(--line); background: var(--surface); position: relative; overflow: hidden; }

.empty { border: 1px dashed var(--line); border-radius: 16px; padding: 28px; text-align: center; color: var(--muted); }

.card:hover { border-color: var(--ink); }
.cphoto { aspect-ratio: 4 / 3; position: relative; display: block; }

.pcount { position: absolute; right: 10px; bottom: 10px; background: rgba(0,0,0,.65); color: #fff; padding: 2px 10px; border-radius: 999px; font-size: .75rem; }

  function closeSheet() { $("overlay").hidden = true; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  function sheetBase(p, inner) {
    $("sheet").innerHTML = '<div class="sin"><div class="sbar"><button type="button" class="pill" data-close>' + t().close + '</button></div><div id="gal"></div><div><h2 id="sheetTitle" style="font-size:1.7rem">' + esc(p.name) + '</h2><div class="meta">' + esc(p.area) + " · " + specs(p) + "</div></div>" + inner + "</div>";
    carousel($("gal"), slides(p), { label: t().glabel + ": " + p.name, thumbs: true, expand: function (i) { lightbox(p, i); } });
  }
  function contactHtml() { return '<label class="field">' + t().name + '<input id="c-name" autocomplete="name"></label><div class="two"><label class="field">' + t().email + '<input id="c-email" type="email" autocomplete="email"></label><label class="field">' + t().phone + '<input id="c-phone" type="tel" autocomplete="tel"></label></div><div class="err" id="c-err" role="alert"></div>'; }
  function contactOk() { return $("c-name").value.trim().length > 1 && /^\S+@\S+\.\S+$/.test($("c-email").value.trim()) && $("c-phone").value.replace(/\D/g, "").length >= 8; }
  var amenList = { stays: ["Shared pool", "A/C", "Wifi", "Equipped kitchen", "Washer", "Terrace", "Safe"], rentals: ["Wifi", "A/C", "Equipped kitchen", "Washer", "Furnished"], sale: ["Pool", "Gym", "Elevator", "Security", "Parking"] };
  function openDetail(id) {
    var p = D.filter(function (x) { return x.id === id; })[0]; S.sel = p;
    var chips = '<div class="chips">' + amenList[p.k].map(function (a) { return '<span class="chip">' + a + "</span>"; }).join("") + "</div>";
    if (p.k === "stays") {
      var e = estimate(p), f = S.f.stays;
      sheetBase(p, chips + '<div class="box"><div class="meta">' + (e.n ? fmtDate(f.in) + " – " + fmtDate(f.out) + " · " + f.guests : "") + '</div><dl class="lines"><div><dt>' + money(p.price, p.cur) + " × " + t().nights(e.n) + '</dt><dd class="num">' + money(e.acc, p.cur) + "</dd></div><div><dt>" + t().cleaning + '</dt><dd class="num">' + money(p.clean, p.cur) + "</dd></div><div><dt>" + t().svc + "</dt><dd>$0</dd></div><div><dt>" + t().taxes + '</dt><dd class="num">' + money(e.tax, p.cur) + '</dd></div><div class="total"><dt>' + t().estTotal + '</dt><dd class="num">' + money(e.total, p.cur) + "</dd></div></dl></div>" +
        '<div class="fine">' + t().cancel + " " + t().estNote + '</div><button type="button" class="btn" data-reserve ' + (e.n ? "" : "disabled") + ">" + t().reserve + (e.n ? " · " + money(e.total, p.cur) : "") + "</button>");
    } else {
      var rent = p.k === "rentals";
      var days = [], d = new Date(); for (var i = 0; i < 7; i++) { d.setDate(d.getDate() + 1); days.push(d.toISOString().slice(0, 10)); }
      var info = rent ? '<div class="price"><b class="num">' + money(p.price, p.cur) + '</b><span class="meta">' + t().month + '</span></div><dl class="lines"><div><dt>' + t().deposit + "</dt><dd>" + t().months(p.dep) + "</dd></div><div><dt>" + t().lease + "</dt><dd>" + p.lmin + "–" + p.lmax + "</dd></div><div><dt>" + t().included + "</dt><dd>" + p.util.join(", ") + "</dd></div></dl>" :
        '<div class="price"><b class="num">' + money(p.price, p.cur) + '</b></div><dl class="lines"><div><dt>' + t().perM2.replace("por", "$ /") + '</dt><dd class="num">' + money(Math.round(p.price / p.m2), p.cur) + "</dd></div><div><dt>" + (lang === "es" ? "Titularidad" : "Title") + "</dt><dd>" + t()[p.own] + "</dd></div>" + (p.inc ? "<div><dt>" + t().estYield + '</dt><dd class="num">' + money(p.inc, "USD") + "/" + (lang === "es" ? "mes" : "mo") + "</dd></div>" : "") + "</dl>";
      sheetBase(p, chips + '<div class="box" id="tour">' + info + "<h3 style=\"font-size:1.1rem\">" + t().pick + '</h3><div class="slots" id="days">' + days.map(function (x, i) { return '<button type="button" class="slot" data-day="' + x + '" aria-pressed="' + (i === 0) + '">' + new Date(x + "T12:00:00Z").toLocaleDateString(lang === "es" ? "es-MX" : "en-US", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" }) + "</button>"; }).join("") + '</div><div class="slots" id="times">' + ["10:00", "11:00", "12:00", "13:00", "16:00", "17:00"].map(function (x) { return '<button type="button" class="slot num" data-time="' + x + '" aria-pressed="false">' + x + "</button>"; }).join("") + '</div><div class="seg" id="mode"><button type="button" data-mode="in-person" aria-pressed="true">' + t().inp + '</button><button type="button" data-mode="video" aria-pressed="false">' + t().video + "</button></div>" + contactHtml() + '<button type="button" class="btn" data-t="' + p.k + '" data-send disabled>' + t().cta[rent ? "rental" : "sale"] + "</button>" + (rent ? '<button type="button" class="btn ghost" data-apply>' + t().apply + "</button>" : "") + "</div>");
    }
    openSheet();
  }
  function checkout() {
    var p = S.sel, e = estimate(p), f = S.f.stays;
    $("sheet").innerHTML = '<div class="sin"><div class="sbar"><button type="button" class="pill" data-back>' + t().back + '</button></div><h2 id="sheetTitle" style="font-size:1.7rem">' + esc(p.name) + '</h2><div class="meta">' + fmtDate(f.in) + " – " + fmtDate(f.out) + '</div><button type="button" class="btn alt" data-wallet>' + t().wallet + " · " + money(e.total, p.cur) + '</button><div class="meta" style="text-align:center">' + t().card + '</div><form class="box" id="payForm" novalidate>' + contactHtml() + '<label class="check"><input type="checkbox" id="c-agree" checked> ' + t().agree + '</label><button class="btn">' + t().pay + " " + money(e.total, p.cur) + '</button></form><div class="fine">' + t().cancel + "</div></div>";
    $("c-name").focus();
  }
  function done(title, body, extra) { $("sheet").innerHTML = '<div class="sin"><div class="ok" role="status"><h2 id="sheetTitle">' + title + "</h2>" + (extra || "") + '<p class="muted" style="margin:0">' + body + '</p></div><button type="button" class="btn ghost" data-close>' + t().keep + "</button></div>"; }

  /* ---- events ---- */
  document.addEventListener("click", function (e) {
    var el = e.target, b;
    if ((b = el.closest("[data-persona]"))) { S.persona[S.view] = b.getAttribute("data-persona") || null; render(); return; }
    if ((b = el.closest("[data-go]"))) { go(b.getAttribute("data-go"), b.getAttribute("data-p") || ""); return; }
    if ((b = el.closest("[data-t].tab"))) { go(b.getAttribute("data-t")); return; }
    if (el.closest("#home")) { go("home"); return; }
    if (el.closest("#menuBtn")) { var open = $("menuPanel").hidden; $("menuPanel").hidden = !open; $("menuBtn").setAttribute("aria-expanded", String(open)); return; }
    if (el.closest("#langBtn")) { lang = lang === "en" ? "es" : "en"; render(); return; }
    if ((b = el.closest(".card"))) { openDetail(b.getAttribute("data-id")); return; }
    if (el.closest("[data-close]") || el.id === "scrim") { closeSheet(); return; }
    if (el.closest("[data-back]")) { openDetail(S.sel.id); return; }
    if (el.closest("[data-reserve]")) { checkout(); return; }
    if (el.closest("[data-wallet]")) { done(t().done, S.sel.name, '<div class="ref">ATM-' + Math.random().toString(36).slice(2, 8).toUpperCase() + "</div>"); return; }
    if ((b = el.closest("[data-day]"))) { document.querySelectorAll("[data-day]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); }); sendState(); return; }
    if ((b = el.closest("[data-time]"))) { document.querySelectorAll("[data-time]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); }); sendState(); return; }
    if ((b = el.closest("[data-mode]"))) { document.querySelectorAll("[data-mode]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); }); return; }
    if (el.closest("[data-send]") || el.closest("[data-apply]")) { if (!contactOk()) { $("c-err").textContent = t().errc; return; } done(t().sentTitle, t().sentBody); return; }
    if (!el.closest(".menu")) { $("menuPanel").hidden = true; $("menuBtn").setAttribute("aria-expanded", "false"); }
  });
  function sendState() { var s = document.querySelector("[data-send]"); if (s) s.disabled = !document.querySelector('[data-time][aria-pressed="true"]'); }
  document.addEventListener("input", function (e) { if (e.target.closest("#tour")) sendState(); });
  document.addEventListener("change", function (e) {
    var id = e.target.id, k = S.view, f = S.f[k]; if (!id || id.indexOf("f-") !== 0) return;
    var key = id.slice(2), v = e.target.type === "checkbox" ? (e.target.checked ? 1 : 0) : e.target.value;
    f[key] = ["guests", "beds", "max", "lease"].indexOf(key) > -1 ? Number(v) || 0 : v;
    S.persona[k] = null; render();
    var again = $(id); if (again) again.focus();
  });
  document.addEventListener("submit", function (e) {
    if (e.target.id !== "payForm") return; e.preventDefault();
    if (!contactOk()) { $("c-err").textContent = t().errc; return; }
    done(t().done, S.sel.name, '<div class="ref">ATM-' + Math.random().toString(36).slice(2, 8).toUpperCase() + "</div>");
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { if (!$("overlay").hidden && !$("lb").open) closeSheet(); else if (!$("menuPanel").hidden) { $("menuPanel").hidden = true; $("menuBtn").focus(); } } });

  var h = (location.hash || "").replace("#", ""); if (["stays", "rentals", "sale"].indexOf(h) > -1) S.view = h;
  render();
})();
</script>
